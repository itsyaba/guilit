services:
  # Self-hosted PostgreSQL 16 with pgvector, pg_trgm, and unaccent
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guilit-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guilit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guilit}
      POSTGRES_DB: ${POSTGRES_DB:-guilit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/0000_extensions.sql:/docker-entrypoint-initdb.d/0000_extensions.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guilit} -d ${POSTGRES_DB:-guilit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Next.js Web Marketplace (standalone production build)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: guilit-web
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guilit}:${POSTGRES_PASSWORD:-guilit}@postgres:5432/${POSTGRES_DB:-guilit}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-guilit-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      LOCAL_STORAGE_DIR: /app/data/media
      # Required. Signs the gl_session JWT (lib/session.ts:19), which throws if
      # unset — fail the `up` with a readable message rather than booting a
      # container that 500s on the first session read.
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env — generate one with openssl rand -hex 32}"
      # Telegram auth. Without the first two /login cannot render a login at
      # all; without the third the bot webhook refuses every update, so a tap
      # on Start never completes the deep-link flow.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_TELEGRAM_USERNAME: ${ADMIN_TELEGRAM_USERNAME}
      # Blank GEMINI_API_KEY is a supported mode — vision autofill and query
      # parsing fall back to their deterministic paths (lib/vision.ts:53).
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      GEMINI_PARSE_MODEL: ${GEMINI_PARSE_MODEL:-gemini-2.0-flash-lite}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      VISION_TIMEOUT_MS: ${VISION_TIMEOUT_MS:-5000}
      SEARCH_PARSE_TIMEOUT_MS: ${SEARCH_PARSE_TIMEOUT_MS:-900}
      PRICE_STATS_TTL_SECONDS: ${PRICE_STATS_TTL_SECONDS:-900}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-600000}
    volumes:
      - ./data/media:/app/data/media:z
    restart: unless-stopped

  # Telegram Ingest Live Listener Daemon
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    container_name: guilit-ingest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guilit}:${POSTGRES_PASSWORD:-guilit}@postgres:5432/${POSTGRES_DB:-guilit}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
      TELEGRAM_SESSION_DIR: /data/sessions
      TELEGRAM_SESSION_NAME: ${TELEGRAM_SESSION_NAME:-guilit_ingest}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-guilit-media}
      LOCAL_STORAGE_DIR: /data/media
      ALBUM_DEBOUNCE_SECONDS: ${ALBUM_DEBOUNCE_SECONDS:-3.0}
      ALLOWLIST_REFRESH_SECONDS: ${ALLOWLIST_REFRESH_SECONDS:-60}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-lite}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      EXTRACTION_BATCH_SIZE: ${EXTRACTION_BATCH_SIZE:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      # Persistent volume for Telethon session files so auth survives restarts
      - telethon_sessions:/data/sessions
      - ./sessions:/data/sessions:z
      # Persistent volume for locally saved media
      - ./data/media:/data/media:z

    restart: unless-stopped

  # Optional one-off backfill profile
  ingest-backfill:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    container_name: guilit-ingest-backfill
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guilit}:${POSTGRES_PASSWORD:-guilit}@postgres:5432/${POSTGRES_DB:-guilit}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION_DIR: /data/sessions
      TELEGRAM_SESSION_NAME: ${TELEGRAM_SESSION_NAME:-guilit_ingest}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: /data/media
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-lite}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      EXTRACTION_BATCH_SIZE: ${EXTRACTION_BATCH_SIZE:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
    volumes:
      - telethon_sessions:/data/sessions
      - ./sessions:/data/sessions
      - ./data/media:/data/media
    command: ["python", "-m", "ingest.cli", "backfill", "--since", "7d"]
    profiles:
      - manual

volumes:
  pgdata:
    name: guilit-pgdata
  telethon_sessions:
    name: guilit-telethon-sessions
